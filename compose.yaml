services:
  threat-intel-mcp:
    build: .
    image: mmcy-threat-intel-mcp:latest
    container_name: mmcy-threat-intel-mcp
    restart: unless-stopped
    ports:
      - "127.0.0.1:3002:3000"
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      MCP_HOST: 0.0.0.0
    depends_on:
      postgres:
        condition: service_healthy
      threat-intel-api:
        condition: service_healthy
    volumes:
      - intel_data:/app/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    init: true

  threat-intel-api:
    build: .
    image: mmcy-threat-intel-mcp:latest
    container_name: mmcy-threat-intel-api
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: ["uvicorn", "app.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3005}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,threat-intel-api}
    volumes:
      - intel_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    init: true

  threat-intel-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        API_INTERNAL_URL: http://threat-intel-api:8000
    image: mmcy-threat-intel-frontend:latest
    container_name: mmcy-threat-intel-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_INTERNAL_URL: http://threat-intel-api:8000
    ports:
      - "${FRONTEND_BIND_ADDRESS:-127.0.0.1}:${FRONTEND_PORT:-3005}:3000"
    depends_on:
      threat-intel-api:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    init: true

  postgres:
    image: postgres:17-alpine
    container_name: mmcy-threat-intel-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true
    init: true

  threat-intel-feeds:
    profiles: ["feeds"]
    build: .
    image: mmcy-threat-intel-mcp:latest
    command: ["python", "-m", "app.services.feeds"]
    restart: unless-stopped
    env_file: [.env]
    volumes:
      - intel_data:/app/data
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=64m"]
    init: true

volumes:
  postgres_data:
  intel_data:
