services:
  threat-intel-mcp:
    build: .
    image: threat-intel-mcp:latest
    restart: unless-stopped
    ports:
    - 127.0.0.1:3002:3000
    env_file:
    - .env
    environment:
      MCP_HOST: 0.0.0.0
      ENABLE_SUBMISSIONS: 'false'
    depends_on:
      threat-intel-api:
        condition: service_healthy
    volumes:
    - intel_data:/app/data
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    read_only: true
    tmpfs:
    - /tmp:rw,noexec,nosuid,size=64m
    init: true
  threat-intel-api:
    build: .
    image: threat-intel-mcp:latest
    restart: unless-stopped
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health',
        timeout=3)
      interval: 10s
      timeout: 5s
      retries: 5
    command:
    - uvicorn
    - app.api.main:app
    - --host
    - 0.0.0.0
    - --port
    - '8000'
    ports:
    - 127.0.0.1:8000:8000
    env_file:
    - .env
    environment:
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3005}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,threat-intel-api}
      ENABLE_SUBMISSIONS: 'false'
    volumes:
    - intel_data:/app/data
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    read_only: true
    tmpfs:
    - /tmp:rw,noexec,nosuid,size=64m
    init: true
  threat-intel-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        API_INTERNAL_URL: http://threat-intel-api:8000
    image: threat-intel-frontend:latest
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_INTERNAL_URL: http://threat-intel-api:8000
    ports:
    - ${FRONTEND_BIND_ADDRESS:-127.0.0.1}:${FRONTEND_PORT:-3005}:3000
    depends_on:
      threat-intel-api:
        condition: service_healthy
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    read_only: true
    tmpfs:
    - /tmp:rw,noexec,nosuid,size=64m
    init: true
  threat-intel-feeds:
    profiles:
    - feeds
    build: .
    image: threat-intel-mcp:latest
    command:
    - python
    - -m
    - app.services.feeds
    restart: unless-stopped
    env_file:
    - .env
    volumes:
    - intel_data:/app/data
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    read_only: true
    tmpfs:
    - /tmp:rw,noexec,nosuid,size=64m
    init: true
    environment:
      ENABLE_SUBMISSIONS: 'false'
volumes:
  intel_data: null
